<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMUC · 战术回放</title><link rel="stylesheet" href="frontend/style.css"></head>
<body>
<nav><b>RMUC <span>2026</span></b><span class="muted">区域赛 · 战术回放</span><button id="choose">选择比赛</button><span id="status">加载比赛列表…</span></nav>
<header><div class="school red"><small>RED TEAM</small><h1 id="redName">红方</h1></div><div class="score"><small id="round">请选择比赛</small><strong id="clock">00:00</strong><span id="result">距开局时间</span></div><div class="school blue"><small>BLUE TEAM</small><h1 id="blueName">蓝方</h1></div></header>
<main><aside id="redCards" class="red"></aside><section id="arena"><canvas id="map"></canvas><div class="mapnote">俯视数据重建 · 底图版本待校准</div><div id="fieldHud"></div><div id="eventFeed"></div><div id="sweep" hidden><small>RADAR COUNTERMEASURE</small><strong></strong><span></span></div><div id="legend">灰：零血量　绿：复活提示　橙：反制 / 易伤</div><div id="caption"></div><div id="victory" hidden><small>比赛结束</small><strong></strong><span></span></div><div id="detail" hidden></div></section><aside id="blueCards" class="blue"></aside></main>
<footer><div id="eventTrack"></div><input id="seek" type="range" min="0" max="420" step="0.1" value="0" aria-label="回放时间"><div class="controls"><button id="play">▶ 播放</button><button id="back">−1 秒</button><button id="next">+1 秒</button><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select><span id="time">00:00 / 07:00</span><label><input id="trails" type="checkbox" checked>轨迹</label><label><input id="effects" type="checkbox" checked>事件</label><button id="follow">跟随选中</button><button id="reset">全场</button><span class="muted hint">点击机器人查看详情 · 滚轮缩放 · 拖动地图</span></div></footer>
<dialog id="picker"><div class="dialoghead"><h2>选择比赛</h2><button id="close">关闭</button></div><div class="filters"><select id="region"><option value="">全部赛区</option></select><input id="search" placeholder="搜索学校 / game_id" aria-label="搜索比赛"></div><div id="matches"></div></dialog>
<script src="frontend/presentation.js"></script><script src="frontend/app.js"></script></body></html>
